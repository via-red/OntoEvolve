server:
  port: 8088

spring:
  application:
    name: onto-education

  datasource:
    url: jdbc:h2:file:./data/education-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # ------------------------------------------------------------
  #  Spring AI — DeepSeek (OpenAI 兼容接口)
  # ------------------------------------------------------------
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-xxxxx}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

onto:
  graph:
    store-type: memory  # memory | neo4j (requires spring.neo4j.* config + Neo4j server)
  rdf:
    store-type: memory
    ontology-path: classpath:ontology/education.ttl
    base-namespace: http://ontoevolve/education#
    inference: rdfs

  classifier:
    implementation: com.ontoevolve.domain.education.service.LLMActionClassifier

  evolution:
    enabled: true
    trigger:
      feedback-count:
        per-niche: 10
      schedule:
        cron: "0 0 2 * * ?"
    population:
      default-capacity: 12
    variators:
      - type: LLM_GENERATE
        weight: 2
      - type: CROSSOVER
        weight: 3
      - type: PERTURB
        weight: 1
    migration:
      enabled: true
      compatibility-threshold: 0.8

  meta:
    enabled: true
    parameters:
      - explorationRate
      - populationCapacity
    target-metrics:
      - averageHypervolume
      - nicheDiversityIndex

  credit:
    assigner: com.ontoevolve.plugins.credit.UniformCreditAssigner
    lambda: 0.9
    max-lookback: 30

  observability:
    evoltrace-store: memory
    metrics:
      prometheus:
        enabled: false

logging:
  level:
    com.ontoevolve: DEBUG
